services:
  backend:
    build:
      context: ./backend
    container_name: relayai-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: sqlite:////data/app.db
      ALLOWED_ORIGINS: http://localhost:3000
      ENABLE_FAILURE_SIMULATION: "true"

    volumes:
      - relayai-data:/data

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000

    container_name: relayai-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  relayai-data: